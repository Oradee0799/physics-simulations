<style>

  .stat b { display:block; font-size:20px; color:#0f766e; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px; }

  .btn-blue { background:#2563eb; color:white; }
  .btn-light { background:#e2e8f0; color:#0f172a; }
  .day { border:1px solid #e2e8f0; border-radius:16px; margin:14px 0; overflow:hidden; background:#fff; }
  .day-header { padding:12px; background:#f8fafc; border-bottom:1px solid #e2e8f0; }
  .day-header h2 { font-size:16px; margin:0 0 4px; }
  .day-meta { font-size:12px; color:#475569; }
  .progress-line { margin-top:8px; height:8px; background:#e2e8f0; border-radius:999px; overflow:hidden; }
  .progress-bar { height:8px; width:0%; background:#22c55e; }
  .student { display:grid; grid-template-columns:28px 1fr; gap:8px; padding:10px 12px; border-bottom:1px dashed #e2e8f0; align-items:start; }
  .student:last-child { border-bottom:0; }
  .student.done { background:#ecfdf5; color:#64748b; }
  .student.done .name { text-decoration: line-through; }
  .seq { font-weight:800; color:#0f766e; }
  .name { font-weight:700; font-size:14px; }
  .detail { color:#475569; font-size:12px; line-height:1.45; }
  .student input { width:20px; height:20px; }
  .issue { background:#fff7ed; border:1px solid #fed7aa; border-radius:12px; padding:10px; margin:10px 0; font-size:13px; }
  .issue h3 { margin:0 0 6px; color:#9a3412; font-size:15px; }
  .legend { display:flex; gap:8px; flex-wrap:wrap; font-size:12px; color:#475569; margin:8px 0; }
  .legend span { background:#f1f5f9; border-radius:999px; padding:4px 8px; }
  .number-marker { width:28px; height:28px; border-radius:50%; background:#2563eb; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.35); }

  .number-marker.east { background:#ea580c; }
  .number-marker.west { background:#0f766e; }
  .number-marker.central { background:#2563eb; }
  .small { font-size:12px; color:#64748b; }
  @media (max-width: 860px) { .app { grid-template-columns:1fr; } .sidebar { max-height:none; } #map { height:65vh; } }

  return 'central';

function makeIcon(seq, done, zone) {

function updateUI() {
  let total = 0, done = 0;

      if (isDone(s.pid)) { done++; dayDone++; }

      if (row) row.classList.toggle('done', isDone(s.pid));
      if (cb) cb.checked = isDone(s.pid);
      if (markers[s.pid]) markers[s.pid].setIcon(makeIcon(s.seq, isDone(s.pid), s.zone));
    });

    const txt = document.getElementById('count-' + day.day.replace(/\s/g,''));

  let html = '';
  if (DATA.invalid > 0) {
    html += `<div class="issue"><h3>พิกัดผิดปกติ ${DATA.invalid} คน</h3>`;
    DATA.issues.invalid.forEach(p => html += `<div>• ${p.name}: ${p.lat}, ${p.lon}<br><span class="small">${p.issue}</span></div>`);
    html += `</div>`;
  }
  if (DATA.missing > 0) {
    html += `<div class="issue"><h3>ยังไม่มีพิกัด ${DATA.missing} คน</h3>`;
    DATA.issues.missing.forEach(p => html += `<div>• ${p.name} ${p.nickname && p.nickname !== '-' ? '('+p.nickname+')' : ''}</div>`);
    html += `</div>`;
  }
  if (DATA.issues.far_warnings.length > 0) {
    html += `<div class="issue"><h3>พิกัดไกลจากกลุ่มมาก</h3>`;
    DATA.issues.far_warnings.forEach(p => html += `<div>• ${p.name} ห่างจากกึ่งกลางประมาณ ${p.distance_km} กม.</div>`);
    html += `</div>`;
  }
  document.getElementById('warnings').innerHTML = html;
}
function renderSidebar() {
  const wrap = document.getElementById('days');
  wrap.innerHTML = DATA.days.map(day => {
    const safeDay = day.day.replace(/\s/g,'');
    return `<section class="day">
      <div class="day-header">
        <h2>${day.day} • ${day.zone}</h2>
        <div class="day-meta">จำนวน ${day.students.length} บ้าน • ระยะเส้นตรงประมาณ ${day.distance_km.toFixed(2)} กม. • <span id="count-${safeDay}">0/${day.students.length} ไปแล้ว</span></div>
        <div class="progress-line"><div class="progress-bar" id="bar-${safeDay}"></div></div>
        <div class="toolbar"><a class="btn btn-blue" target="_blank" href="${day.route_link}">เปิดนำทาง Google Maps</a></div>
      </div>
      <div>${day.students.map(s => `<div class="student" id="row-${s.pid}">
        <div><input id="cb-${s.pid}" type="checkbox" onchange="toggleDone('${s.pid}', this.checked)"></div>
        <div><div class="name"><span class="seq">${s.seq}.</span> ${s.name}</div>
        <div class="detail">ชื่อเล่น: ${s.nickname}<br>พิกัด: ${Number(s.lat).toFixed(6)}, ${Number(s.lon).toFixed(6)}<br><a target="_blank" href="${s.point_link}">เปิดตำแหน่งบ้าน</a></div></div>
      </div>`).join('')}</div>
    </section>`;
  }).join('');
}
function renderMap() {
  const bounds = [];
  const colors = ['#0f766e','#2563eb','#ea580c','#7c3aed'];
  DATA.days.forEach((day, idx) => {
    const latlngs = day.students.map(s => [s.lat, s.lon]);
    if (latlngs.length > 1) L.polyline(latlngs, {color: colors[idx % colors.length], weight:4, opacity:0.72}).addTo(map);
    day.students.forEach(s => {
      const m = L.marker([s.lat, s.lon], {icon: makeIcon(s.seq, isDone(s.pid), s.zone)}).addTo(map);
      m.bindPopup(`<b>${day.day} ลำดับ ${s.seq}</b><br>กดดูรายชื่อในแถบด้านข้าง`);
      m.on('click', () => document.getElementById('row-' + s.pid)?.scrollIntoView({behavior:'smooth', block:'center'}));
      markers[s.pid] = m;
      bounds.push([s.lat, s.lon]);
    });
  });
  if (bounds.length) map.fitBounds(bounds, {padding:[30,30]}); else map.setView([17.15,104.15], 10);
}
renderWarnings(); renderSidebar(); renderMap(); updateUI();
</script>
</body>
</html>
